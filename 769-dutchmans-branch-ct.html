<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>769 Dutchmans Branch Ct, Irmo SC | Nicholas Carnes, Keller Williams</title>
<meta name="description" content="Request a private showing and get the details on 769 Dutchmans Branch Ct in The Preserve at Rolling Creek before it's gone.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗝️</text></svg>">

<script>
var CONFIG = {
  endpoint : "https://script.google.com/macros/s/AKfycbzinlEUuoeLmQYG8J6kgP5ivdxwLO7RJsGciQOsXQhmD6Tmt9xxpd1ahB6PF_jRug7R/exec",
  listingId: "769-dutchmans-branch-ct-irmo",

  agent    : "Nicholas Carnes",
  brokerage: "Keller Williams",
  phone    : "803-930-3871",
  email    : "ncarnes@kw.com",
  license  : "SC License #146819",

  address  : "769 Dutchmans Branch Court",
  city     : "Irmo",
  state    : "SC",
  price    : 475000,
  beds     : 4,
  baths    : 3,
  sqft     : 3001,
  headline : "We’ve Already Done The Hard Part — This Is Your Dream Home.",
  blurb    : "4 bedrooms, 3 baths, and just over 3,000 square feet in The Preserve at Rolling Creek. Move-in ready with room to spare, minutes from Lake Murray and downtown Chapin.",

  heroType : "image",
  heroSrc  : "769-dutchmans-branch-ct-hero.jpg",
  heroPoster: "",
  tourUrl  : "https://my.matterport.com/show/?m=itbXqjYuxWr",

  // Meta Pixel — paste your Pixel ID from Events Manager, or leave blank to skip.
  pixelId  : ""
};
</script>

<style>
:root{
  --paper:#F8F6F2; --card:#FFFFFF; --soft:#F1ECE1;
  --ink:#1F1A12; --ink2:#5A5142; --ink3:#736A5A;
  --line:#E6DFCF; --line2:#D0C4A8;
  --gold:#83600F; --gold-wash:#F4EBD8;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;}
.wrap{max-width:560px; margin:0 auto; padding:0 0 60px;}
h1,h2{margin:0; line-height:1.15; text-wrap:balance; letter-spacing:-.02em;}
p{margin:0;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px;}

.hero{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--soft);}
.body-pad{padding:20px 20px 0;}
.eyebrow{display:inline-block; background:var(--gold-wash); color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:7px 11px; border-radius:5px; line-height:1.4; margin-bottom:14px;}
h1{font-size:clamp(26px,7vw,34px); font-weight:800; margin-bottom:8px;}
.addr{color:var(--ink2); font-size:16px; margin-bottom:14px;}
.stats{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.stat{background:var(--card); border:1.5px solid var(--line2); border-radius:8px; padding:8px 13px;}
.stat b{display:block; font-size:16px; color:var(--ink);}
.stat span{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3);}
.price{font-size:28px; font-weight:800; color:var(--gold); margin-bottom:14px;}
.blurb{color:var(--ink2); font-size:15.5px; margin-bottom:22px;}

.btn{display:block; width:100%; cursor:pointer; border:0; border-radius:10px; background:var(--gold); color:#fff; font-family:var(--sans); font-size:17px; font-weight:700; padding:17px 22px; text-align:center; transition:filter .15s, transform .06s;}
.btn:hover{filter:brightness(1.1);}
.btn:active{transform:translateY(1px);}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.trust{margin-top:24px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink3); line-height:1.6;}

.sub{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); font-weight:700; margin-bottom:10px; display:block;}
.opts{display:flex; flex-direction:column; gap:9px; margin-bottom:22px;}
.opt{display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer; background:var(--card); border:1.5px solid var(--line2); border-radius:10px; padding:15px 16px; font-family:var(--sans); font-size:16px; color:var(--ink); line-height:1.35; transition:border-color .12s, background .12s;}
.opt:hover{border-color:var(--gold);}
.opt[aria-pressed="true"]{border-color:var(--gold); background:var(--gold-wash); font-weight:600;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:22px;}
.row2 .opt{justify-content:center; text-align:center;}
input[type=text],input[type=tel],input[type=email]{width:100%; font-family:var(--serif); font-size:17px; padding:14px 15px; border:1.5px solid var(--line2); border-radius:10px; background:var(--card); color:var(--ink); margin-bottom:14px;}
::placeholder{color:var(--ink3); font-style:italic;}
.consent{font-size:12.5px; color:var(--ink3); line-height:1.55; margin-bottom:20px;}
.q{margin-bottom:6px;}
.qh{font-size:16px; font-weight:700; margin-bottom:12px;}

.ok .body-pad{padding-top:26px;}
.ok h1{font-size:clamp(24px,6.5vw,30px); margin-bottom:10px;}
.ok .sub-l{color:var(--ink2); font-size:16px; margin-bottom:22px;}
.card{background:var(--card); border:1.5px solid var(--line2); border-radius:12px; padding:18px 19px; margin-bottom:15px;}
.chead{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; margin-bottom:9px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--gold); flex:none;}
@media (prefers-reduced-motion:no-preference){ .dot{animation:pl 2.2s ease-in-out infinite;} @keyframes pl{0%,100%{opacity:1}50%{opacity:.25}} }
.card p{font-size:15px; color:var(--ink2); margin-bottom:14px;}
.card p b{color:var(--ink);}
.tiny{font-size:12.5px; color:var(--ink3); margin-top:9px;}
.next li{font-size:15px; color:var(--ink2); margin-bottom:9px; line-height:1.5;}
.next{padding-left:20px; margin:0;}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script>
(function(){
"use strict";

var app = document.getElementById('app');
var A = {}, sent = false, submitted = false;

function money(n){ return '$' + Number(n).toLocaleString('en-US'); }
function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }
function el(id){ return document.getElementById(id); }
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim()); }
function validPhone(v){ return (v||'').replace(/\D/g,'').length >= 10; }
function gateOk(){ return !!(A.timeline && A.hasAgent && A.wantsShowing && A.name && A.name.trim() && validPhone(A.phone) && validEmail(A.email)); }

function render(){
  submitted ? confirmation() : form();
  window.scrollTo(0,0);
}

function heroTag(){
  if(CONFIG.heroType === 'video'){
    return '<video class="hero" autoplay muted loop playsinline'+(CONFIG.heroPoster?' poster="'+esc(CONFIG.heroPoster)+'"':'')+'>'+
           '<source src="'+esc(CONFIG.heroSrc)+'" type="video/mp4"></video>';
  }
  return '<img class="hero" src="'+esc(CONFIG.heroSrc)+'" alt="'+esc(CONFIG.address)+'">';
}

function opts(list, key, val){
  return list.map(function(o){
    var on = val === o.v;
    return '<button class="opt" data-k="'+esc(key)+'" data-v="'+esc(o.v)+'" aria-pressed="'+(on?'true':'false')+'">'+esc(o.l)+'</button>';
  }).join('');
}

function form(){
  app.className = 'wrap';
  app.innerHTML =
    heroTag() +
    '<div class="body-pad">'+
    '<span class="eyebrow">Just Listed &middot; '+esc(CONFIG.city)+', '+esc(CONFIG.state)+'</span>'+
    '<h1>'+esc(CONFIG.headline)+'</h1>'+
    '<p class="addr">'+esc(CONFIG.address)+', '+esc(CONFIG.city)+', '+esc(CONFIG.state)+'</p>'+
    '<div class="price">'+money(CONFIG.price)+'</div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+esc(CONFIG.beds)+'</b><span>Beds</span></div>'+
      '<div class="stat"><b>'+esc(CONFIG.baths)+'</b><span>Baths</span></div>'+
      '<div class="stat"><b>'+Number(CONFIG.sqft).toLocaleString('en-US')+'</b><span>Sq Ft</span></div>'+
    '</div>'+
    '<p class="blurb">'+esc(CONFIG.blurb)+'</p>'+
    (CONFIG.tourUrl ? '<p style="margin:-8px 0 22px"><a href="'+esc(CONFIG.tourUrl)+'" target="_blank" rel="noopener" style="color:var(--gold);font-weight:700;font-size:14.5px;text-decoration:none;">&#9678; View The 3D Walkthrough &rarr;</a></p>' : '')+

    '<div class="q"><div class="qh">What\'s your timeline to move?</div><div class="opts">'+
      opts([{v:'ASAP',l:'ASAP'},{v:'Within 30 days',l:'Within 30 days'},{v:'1 to 3 months',l:'1 to 3 months'},{v:'Just researching',l:'Just researching for now'}], 'timeline', A.timeline)+
    '</div></div>'+

    '<div class="q"><div class="qh">Are you already working with a real estate agent?</div><div class="row2">'+
      opts([{v:'Yes',l:'Yes'},{v:'No',l:'No'}], 'hasAgent', A.hasAgent)+
    '</div></div>'+

    '<div class="q"><div class="qh">Want to schedule a private showing this week?</div><div class="row2">'+
      opts([{v:'Yes',l:'Yes, let\'s do it'},{v:'No',l:'Not yet'}], 'wantsShowing', A.wantsShowing)+
    '</div></div>'+

    '<span class="sub">Your name</span><input type="text" id="nm" value="'+esc(A.name||'')+'" placeholder="Jane Smith" autocomplete="name">'+
    '<span class="sub">Mobile number</span><input type="tel" id="ph" value="'+esc(A.phone||'')+'" placeholder="(803) 555-0142" autocomplete="tel" inputmode="tel">'+
    '<span class="sub">Email</span><input type="email" id="em" value="'+esc(A.email||'')+'" placeholder="you@email.com" autocomplete="email" inputmode="email">'+
    '<p class="consent">By submitting you agree to receive texts and calls from '+esc(CONFIG.agent)+' at '+esc(CONFIG.brokerage)+
    ' about this property. Message and data rates may apply. Reply STOP at any time to opt out.</p>'+
    '<button class="btn" id="go"'+(gateOk()?'':' disabled')+'>Request Info &amp; Showing &rarr;</button>'+

    '<div class="trust"><b>'+esc(CONFIG.agent)+'</b> &middot; '+esc(CONFIG.brokerage)+'<br>'+
    esc(CONFIG.license)+' &middot; Each office is independently owned and operated. Equal Housing Opportunity.</div>'+
    '</div>';

  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
    b.onclick = function(){ A[b.getAttribute('data-k')] = b.getAttribute('data-v'); form(); };
  });
  el('nm').oninput = function(){ A.name=this.value; gate(); };
  el('ph').oninput = function(){ A.phone=this.value; gate(); };
  el('em').oninput = function(){ A.email=this.value; gate(); };
  function gate(){ el('go').disabled = !gateOk(); }
  el('go').onclick = function(){ if(!gateOk()) return; submitted = true; render(); };
}

function submit(){
  if(sent) return; sent = true;
  var payload = JSON.stringify({
    quizType:'showing', listingId:CONFIG.listingId, address:CONFIG.address, city:CONFIG.city, price:CONFIG.price,
    name:A.name, phone:A.phone, email:A.email, timeline:A.timeline, hasAgent:A.hasAgent, wantsShowing:A.wantsShowing,
    page:location.href, ts:new Date().toISOString()
  });
  if(!CONFIG.endpoint || CONFIG.endpoint.indexOf('PASTE_') === 0){
    console.warn('CONFIG.endpoint not set — nothing was sent.'); return;
  }
  try{
    fetch(CONFIG.endpoint, { method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:payload, keepalive:true
    })['catch'](function(){ beacon(payload); });
  }catch(e){ beacon(payload); }
}
function beacon(p){ try{ navigator.sendBeacon(CONFIG.endpoint, new Blob([p],{type:'text/plain;charset=utf-8'})); }catch(e){} }

function confirmation(){
  submit();
  var nm = (A.name||'there').trim().split(' ')[0];
  var showing = A.wantsShowing === 'Yes';
  app.className = 'wrap ok';
  app.innerHTML =
    '<div class="body-pad">'+
    '<h1>Got It, '+esc(nm)+'.</h1>'+
    '<p class="sub-l">Your request for <b>'+esc(CONFIG.address)+'</b> is in.</p>'+

    '<div class="card"><div class="chead"><span class="dot"></span>Keep Your Phone Close</div>'+
    '<p>'+(showing
      ? 'You asked about a <b>private showing this week</b> — I\'ll text or call you shortly to lock in a time, usually within the hour.'
      : 'I\'ll text or call you shortly with more on this home and answer any questions — usually within the hour.')+
    ' It\'ll come from a real number: '+esc(CONFIG.phone)+'.</p>'+
    '<button class="btn" id="vcf" style="background:var(--ink)">&darr; Save My Contact</button>'+
    '<p class="tiny" id="vn">One tap. Adds '+esc(CONFIG.agent.split(' ')[0])+' to your contacts.</p></div>'+

    '<div class="card"><div class="lbl" style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:12px;">What happens next</div><ol class="next">'+
      '<li><b>I confirm the details</b> on '+esc(CONFIG.address)+' are current — sometimes things change fast once a home is under a lot of interest.</li>'+
      (showing ? '<li><b>We lock in a showing time</b> that works for you this week.</li>' : '<li><b>I answer your questions</b> and send anything else useful — no pressure.</li>')+
      '<li><b>If it\'s a fit, we move.</b> If not, no hard feelings — I\'m happy to help either way.</li>'+
    '</ol></div>'+

    '<div class="trust"><b>'+esc(CONFIG.agent)+'</b> &middot; '+esc(CONFIG.brokerage)+'<br>'+
    esc(CONFIG.license)+' &middot; Each office is independently owned and operated. Equal Housing Opportunity.</div>'+
    '</div>';

  el('vcf').onclick = saveContact;
}

function saveContact(){
  var v = ['BEGIN:VCARD','VERSION:3.0','N:'+CONFIG.agent.split(' ').slice(1).join(' ')+';'+CONFIG.agent.split(' ')[0]+';;;',
    'FN:'+CONFIG.agent,'ORG:'+CONFIG.brokerage,'TITLE:REALTOR®',
    'TEL;TYPE=CELL:'+CONFIG.phone,'EMAIL:'+CONFIG.email,'END:VCARD'].join('\r\n');
  var url = URL.createObjectURL(new Blob([v],{type:'text/vcard'}));
  var a = document.createElement('a');
  a.href = url; a.download = CONFIG.agent.replace(/\s+/g,'-')+'.vcf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  el('vn').innerHTML = '<b style="color:var(--gold)">Saved.</b> Open the downloaded card to add it.';
}

/* Meta Pixel — no-op until CONFIG.pixelId is set */
if(CONFIG.pixelId){
  (function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)})(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CONFIG.pixelId);
  fbq('track', 'PageView');
}

render();
})();
</script>
</body>
</html>
